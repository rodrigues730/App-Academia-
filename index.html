<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Academia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }

        /* LOGIN SCREEN */
        .login-screen {
            display: none;
        }
        .login-screen.show {
            display: block;
        }
        .login-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 30px;
            color: #4CAF50;
        }
        .profiles-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .profile-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }
        .profile-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .profile-info {
            font-size: 12px;
            opacity: 0.8;
        }

        .btn-new-profile {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .btn-new-profile:hover {
            background: #45a049;
        }

        /* NEW PROFILE MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }
        .modal.show { display: block; }
        .modal-content {
            background-color: #2a2a2a;
            margin: 20% auto;
            padding: 30px;
            border: 1px solid #444;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn-confirm {
            flex: 1;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-confirm:hover { background: #45a049; }
        .btn-cancel {
            flex: 1;
            background: #555;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel:hover { background: #666; }

        /* APP SCREEN */
        .app-screen {
            display: none;
        }
        .app-screen.show {
            display: block;
        }

        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .profile-display {
            text-align: left;
        }
        .profile-label {
            font-size: 12px;
            opacity: 0.8;
        }
        .profile-name-header {
            font-size: 18px;
            font-weight: bold;
        }
        .btn-switch-profile {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-switch-profile:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #aaa;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        .tab-btn.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }
        .tab-btn:hover { color: #fff; }

        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* TIMER SECTION */
        .timer-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .timer-display {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }
        .timer-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        .timer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-start {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-start:hover { background: #45a049; }
        .btn-end {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-end:hover { background: #da190b; }
        .btn-end:disabled { background: #ccc; cursor: not-allowed; }

        .progress-bar { 
            background: #333; 
            height: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .rest-timer {
            background: #ff9800;
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
            display: none;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .rest-timer.active { display: block; }

        /* DAY BOX */
        .day-box {
            background: #2a2a2a;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .day-header {
            background: #333;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-header:hover { background: #3a3a3a; }
        .day-title { font-weight: bold; font-size: 16px; }
        .day-focus { font-size: 12px; color: #aaa; }
        .day-controls {
            display: flex;
            gap: 5px;
        }
        .btn-add {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-add:hover { background: #0b7dda; }

        .exercise {
            border-top: 1px solid #444;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            position: relative;
        }
        .exercise:hover { background: #333; }
        .exercise-delete {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #f44336;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .exercise-delete:hover { background: #da190b; }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            font-size: 14px;
            background: #333;
            transition: all 0.2s;
        }
        .checkbox:hover { border-color: #4CAF50; }
        .checkbox.checked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        .exercise-info { 
            flex: 1;
            cursor: pointer;
        }
        .exercise-name { font-weight: bold; font-size: 14px; }
        .exercise-sets { font-size: 12px; color: #aaa; }

        .exercise-details {
            display: none;
            background: #1a1a1a;
            padding: 15px;
            border-top: 1px solid #444;
            font-size: 13px;
            line-height: 1.6;
        }
        .exercise-details.show { display: block; }

        .detail-section { margin-bottom: 15px; }
        .detail-title { font-weight: bold; color: #4CAF50; margin-bottom: 8px; }

        .video-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        .video-btn:hover { background: #cc0000; }

        .hidden { display: none; }

        /* HISTÓRICO */
        .history-stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 12px;
            color: #ddd;
        }

        .history-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .history-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #4CAF50;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }
        .history-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.2);
        }
        .history-date {
            font-size: 12px;
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .history-day {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .history-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .history-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        /* EXERCISE SELECTOR */
        .exercise-selector {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .exercise-option {
            background: #333;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #444;
            transition: all 0.3s;
        }
        .exercise-option:hover {
            border-color: #4CAF50;
            background: #3a3a3a;
        }
        .exercise-option-name {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        .exercise-option-desc {
            font-size: 12px;
            color: #aaa;
        }

        .match-indicator {
            font-size: 12px;
            color: #4CAF50;
            margin-top: 10px;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: white;
            font-family: inherit;
            font-size: 13px;
            min-height: 80px;
            resize: vertical;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .modal-btn-confirm {
            background: #4CAF50;
            color: white;
        }
        .modal-btn-confirm:hover { background: #45a049; }
        .modal-btn-cancel {
            background: #555;
            color: white;
        }
        .modal-btn-cancel:hover { background: #666; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen show">
        <div class="container">
            <div class="login-title">💪 Academia</div>
            <div class="profiles-list" id="profilesList"></div>
            <button class="btn-new-profile" onclick="openNewProfileModal()">➕ Novo Perfil</button>
        </div>
    </div>

    <!-- APP SCREEN -->
    <div id="appScreen" class="app-screen">
        <div class="container">
            <h1>💪 Seu Treino</h1>
            
            <!-- HEADER COM PERFIL -->
            <div class="app-header">
                <div class="profile-display">
                    <div class="profile-label">👤 Perfil</div>
                    <div class="profile-name-header" id="currentProfileName"></div>
                </div>
                <button class="btn-switch-profile" onclick="switchProfile()">Trocar Perfil</button>
            </div>

            <!-- TABS -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('workout')">📅 Treino</button>
                <button class="tab-btn" onclick="switchTab('history')">📊 Histórico</button>
            </div>

            <!-- TAB TREINO -->
            <div id="workout" class="tab-content active">
                <div class="timer-section">
                    <div class="timer-label">⏱️ Tempo Total de Academia</div>
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                    <div class="timer-buttons">
                        <button class="btn-start" id="btnStart" onclick="startWorkout()">▶️ Iniciar</button>
                        <button class="btn-end" id="btnEnd" onclick="endWorkout()" disabled>🛑 Encerrar</button>
                    </div>
                </div>

                <div class="rest-timer" id="restTimer"></div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div id="workoutContainer"></div>
            </div>

            <!-- TAB HISTÓRICO -->
            <div id="history" class="tab-content">
                <div class="history-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalWorkouts">0</div>
                        <div class="stat-label">Treinos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalHours">0h</div>
                        <div class="stat-label">Tempo Total</div>
                    </div>
                </div>

                <div id="historyCards" class="history-cards"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NOVO PERFIL -->
    <div id="newProfileModal" class="modal">
        <div class="modal-content">
            <h2>➕ Novo Perfil</h2>
            <div class="form-group">
                <label>Nome do Perfil *</label>
                <input type="text" id="newProfileName" placeholder="Ex: João, Maria, etc">
            </div>
            <div class="form-buttons">
                <button class="btn-confirm" onclick="createProfile()">✓ Criar</button>
                <button class="btn-cancel" onclick="closeNewProfileModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL ADICIONAR EXERCÍCIO -->
    <div id="addExerciseModal" class="modal">
        <div class="modal-content" style="max-width: 500px; max-height: 80vh; overflow-y: auto;">
            <h2>➕ Novo Exercício</h2>
            
            <div class="form-group">
                <label>Nome do Exercício *</label>
                <input type="text" id="exerciseName" placeholder="Ex: Supino Reto" oninput="searchExercises()">
                <div id="matchIndicator" class="match-indicator"></div>
            </div>

            <div id="exerciseMatches" class="exercise-selector hidden"></div>

            <div class="form-group">
                <label>Séries x Reps *</label>
                <input type="text" id="exerciseSets" placeholder="Ex: 3 x 10">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea id="exerciseDesc" placeholder="Como fazer o exercício"></textarea>
            </div>

            <div class="form-group">
                <label>Passo a Passo</label>
                <textarea id="exerciseSteps" placeholder="1. Passo 1&#10;2. Passo 2"></textarea>
            </div>

            <div class="form-group">
                <label>Dicas</label>
                <textarea id="exerciseTips" placeholder="✓ Dica 1&#10;✓ Dica 2"></textarea>
            </div>

            <div class="form-group">
                <label>Evite</label>
                <textarea id="exerciseAvoid" placeholder="✗ Evite 1&#10;✗ Evite 2"></textarea>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn modal-btn-confirm" onclick="confirmAddExercise()">✓ Adicionar</button>
                <button class="modal-btn modal-btn-cancel" onclick="closeAddModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL CONCLUSÃO -->
    <div id="finishModal" class="modal">
        <div class="modal-content">
            <h2>🎉 Treino Concluído!</h2>
            <p id="finalTime" style="font-size: 24px; font-weight: bold; color: #4CAF50;"></p>
            <p>Parabéns! Você treinou muito bem! 💪</p>
            <button class="btn-confirm" onclick="closeFinishModal()" style="width: 100%;">✓ Nova Jornada</button>
            <div class="match-indicator" id="modalTimer">Fechando em 3s...</div>
        </div>
    </div>

    <script>
        let workoutStartTime = null;
        let timerInterval = null;
        let restTimerInterval = null;
        let isWorkoutActive = false;
        let modalCloseTimer = null;
        let currentAddingDayIdx = null;
        let selectedExerciseFromBank = null;
        let currentProfile = null;

        // Dados do usuário por perfil
        let profiles = [];
        let workouts = {};
        let checkedExercises = {};
        let customExercises = {};
        let workoutHistory = {};

        const exerciseBank = [
            { name: "Supino Reto", desc: "Deite-se no banco com pés apoiados. Pegue a barra acima da largura dos ombros. Abaixe até o peito. Suba explosivamente.", steps: "1. Sente firme no banco\n2. Pegue barra além da largura\n3. Levante acima do peito\n4. Abaixe lentamente até peito\n5. Pause 1 segundo\n6. Empurre explosivamente\n7. Repita 6-8 vezes", tips: "✓ Cotovelos a 45°\n✓ Respire corretamente\n✓ Controle sempre", avoid: "✗ Não dar quique\n✗ Não abrir cotovelos demais\n✗ Não trancar", video: "https://www.youtube.com/results?search_query=supino+reto+barra+forma+correta" },
            { name: "Supino Inclinado", desc: "Banco inclinado a 45°. Pegue a barra acima da largura. Abaixe até o peito superior. Suba explosivamente.", steps: "1. Ajuste banco a 45°\n2. Sente firme\n3. Pegue barra acima largura\n4. Abaixe controladamente\n5. Até peito superior\n6. Pause 1 segundo\n7. Suba explosivo", tips: "✓ Trabalha peito superior\n✓ Cotovelos 45°\n✓ Movimento controlado", avoid: "✗ Não deixar banco cair\n✗ Sem impulso\n✗ Não trancar", video: "https://www.youtube.com/results?search_query=supino+inclinado+peito+forma+correta" },
            { name: "Crucifixo no Cabo", desc: "Em pé no centro. Pegue as alças com braços abertos. Puxe em movimento de abraço.", steps: "1. Posicione-se no centro\n2. Pegue as alças abertas\n3. Cotovelos flexionados\n4. Puxe em movimento de abraço\n5. Aproxime na frente\n6. Pause 1 segundo\n7. Retorne controlado", tips: "✓ Controle total\n✓ Foco na contração\n✓ Movimento fluido", avoid: "✗ Sem impulso\n✗ Sem deixar cair", video: "https://www.youtube.com/results?search_query=crucifixo+no+cabo+peito+forma+correta" },

                    { name: "Abdominal Dinâmico", sets: "3 x 15-20", video: "https://www.youtube.com/results?search_query=abdominal+dinâmico+forma+correta", desc: "Deitado de costas. Joelhos flexionados. Levante o tronco com contração.", steps: "1. Deite de costas\n2. Joelhos flexionados\n3. Pés apoiados\n4. Coloque mãos atrás cabeça\n5. Levante tronco\n6. Máxima contração\n7. Abaixe controlado", tips: "✓ Contração máxima\n✓ Movimento lento\n✓ Foco no abdômen", avoid: "✗ Sem puxar pescoço\n✗ Sem impulso" },

        // ===== PROFILE MANAGEMENT =====
        function loadData() {
            const savedProfiles = localStorage.getItem('profiles');
            const current = localStorage.getItem('currentProfile');
            
            if (savedProfiles) {
                profiles = JSON.parse(savedProfiles);
            }
            if (current) {
                currentProfile = current;
            }
            
            renderProfilesScreen();
        }

        function renderProfilesScreen() {
            const container = document.getElementById('profilesList');
            container.innerHTML = '';
            
            if (profiles.length === 0) {
                document.getElementById('loginScreen').classList.add('show');
                document.getElementById('appScreen').classList.remove('show');
                return;
            }
            
            profiles.forEach(profile => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <div class="profile-name">👤 ${profile}</div>
                    <div class="profile-info">Clique para entrar</div>
                `;
                card.onclick = () => selectProfile(profile);
                container.appendChild(card);
            });
        }

        function selectProfile(profileName) {
            currentProfile = profileName;
            localStorage.setItem('currentProfile', profileName);
            loadProfileData();
            showAppScreen();
        }

        function loadProfileData() {
            const prefix = `profile_${currentProfile}_`;
            
            const savedWorkouts = localStorage.getItem(prefix + 'workouts');
            workouts[currentProfile] = savedWorkouts ? JSON.parse(savedWorkouts) : JSON.parse(JSON.stringify(defaultWorkouts));
            
            const savedChecked = localStorage.getItem(prefix + 'checkedExercises');
            checkedExercises[currentProfile] = savedChecked ? JSON.parse(savedChecked) : {};
            
            const savedCustom = localStorage.getItem(prefix + 'customExercises');
            customExercises[currentProfile] = savedCustom ? JSON.parse(savedCustom) : [];
            
            const savedHistory = localStorage.getItem(prefix + 'workoutHistory');
            workoutHistory[currentProfile] = savedHistory ? JSON.parse(savedHistory) : [];
        }

        function saveProfileData() {
            const prefix = `profile_${currentProfile}_`;
            localStorage.setItem(prefix + 'workouts', JSON.stringify(workouts[currentProfile]));
            localStorage.setItem(prefix + 'checkedExercises', JSON.stringify(checkedExercises[currentProfile]));
            localStorage.setItem(prefix + 'customExercises', JSON.stringify(customExercises[currentProfile]));
            localStorage.setItem(prefix + 'workoutHistory', JSON.stringify(workoutHistory[currentProfile]));
        }

        function openNewProfileModal() {
            document.getElementById('newProfileModal').classList.add('show');
        }

        function closeNewProfileModal() {
            document.getElementById('newProfileModal').classList.remove('show');
            document.getElementById('newProfileName').value = '';
        }

        function createProfile() {
            const name = document.getElementById('newProfileName').value.trim();
            
            if (!name) {
                alert('Nome do perfil obrigatório!');
                return;
            }
            
            if (profiles.includes(name)) {
                alert('Este perfil já existe!');
                return;
            }
            
            profiles.push(name);
            localStorage.setItem('profiles', JSON.stringify(profiles));
            closeNewProfileModal();
            renderProfilesScreen();
        }

        function switchProfile() {
            saveProfileData();
            currentProfile = null;
            document.getElementById('loginScreen').classList.add('show');
            document.getElementById('appScreen').classList.remove('show');
            renderProfilesScreen();
        }

        function showAppScreen() {
            document.getElementById('loginScreen').classList.remove('show');
            document.getElementById('appScreen').classList.add('show');
            document.getElementById('currentProfileName').textContent = currentProfile;
            render();
        }

        // ===== APP FUNCTIONS =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'history') {
                renderHistory();
            }
        }

        function startWorkout() {
            if (!isWorkoutActive) {
                workoutStartTime = Date.now();
                isWorkoutActive = true;
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnEnd').disabled = false;
                startTimer();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            if (!workoutStartTime || !isWorkoutActive) return;
            const elapsed = Date.now() - workoutStartTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const display = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = display;
        }

        function endWorkout() {
            if (!isWorkoutActive) return;
            clearInterval(timerInterval);
            isWorkoutActive = false;
            
            const elapsed = Date.now() - workoutStartTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const display = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            
            const completedCount = Object.keys(checkedExercises[currentProfile]).length;
            const totalExercises = workouts[currentProfile].reduce((sum, day) => sum + day.exercises.length, 0);
            
            workoutHistory[currentProfile].push({
                date: new Date().toISOString(),
                totalTime: elapsed,
                completed: completedCount,
                total: totalExercises
            });
            
            saveProfileData();
            
            document.getElementById('finalTime').textContent = display;
            document.getElementById('finishModal').classList.add('show');
            
            checkedExercises[currentProfile] = {};
            render();
            
            let countDown = 3;
            document.getElementById('modalTimer').textContent = `Fechando em ${countDown}s...`;
            
            modalCloseTimer = setInterval(() => {
                countDown--;
                if (countDown > 0) {
                    document.getElementById('modalTimer').textContent = `Fechando em ${countDown}s...`;
                } else {
                    clearInterval(modalCloseTimer);
                    closeFinishModal();
                }
            }, 1000);
            
            resetWorkout();
        }

        function closeFinishModal() {
            if (modalCloseTimer) clearInterval(modalCloseTimer);
            document.getElementById('finishModal').classList.remove('show');
        }

        function resetWorkout() {
            workoutStartTime = null;
            isWorkoutActive = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnEnd').disabled = true;
            document.getElementById('timerDisplay').textContent = '00:00:00';
        }

        function startRestTimer() {
            if (restTimerInterval) clearInterval(restTimerInterval);
            let restSeconds = 60;
            const restEl = document.getElementById('restTimer');
            restEl.classList.add('active');
            restEl.textContent = `⏳ Descanso: ${restSeconds}s`;
            
            restTimerInterval = setInterval(() => {
                if (restSeconds > 0) {
                    restEl.textContent = `⏳ Descanso: ${restSeconds}s`;
                    restSeconds--;
                } else {
                    clearInterval(restTimerInterval);
                    restEl.classList.remove('active');
                }
            }, 1000);
        }

        function toggleCheck(dayIdx, exIdx) {
            const key = `${dayIdx}-${exIdx}`;
            const el = document.getElementById(`check${key}`);
            
            if (!el.classList.contains('checked')) {
                el.classList.add('checked');
                el.innerHTML = '✓';
                checkedExercises[currentProfile][key] = true;
                startRestTimer();
            } else {
                el.classList.remove('checked');
                el.innerHTML = '';
                delete checkedExercises[currentProfile][key];
            }
            
            saveProfileData();
            updateProgress();
        }

        function deleteExercise(dayIdx, exIdx) {
            if (confirm('Deletar exercício?')) {
                workouts[currentProfile][dayIdx].exercises.splice(exIdx, 1);
                saveProfileData();
                render();
            }
        }

        function searchExercises() {
            const name = document.getElementById('exerciseName').value.toLowerCase();
            const matchesContainer = document.getElementById('exerciseMatches');
            
            if (!name.trim()) {
                matchesContainer.classList.add('hidden');
                document.getElementById('matchIndicator').textContent = '';
                return;
            }
            
            const matches = exerciseBank.filter(ex => ex.name.toLowerCase().includes(name));
            
            if (matches.length === 0) {
                matchesContainer.classList.add('hidden');
                document.getElementById('matchIndicator').textContent = '❌ Nenhum exercício encontrado';
                return;
            }
            
            matchesContainer.classList.remove('hidden');
            matchesContainer.innerHTML = '';
            
            document.getElementById('matchIndicator').textContent = `✅ Encontrado ${matches.length} exercício(s)`;
            
            matches.forEach(ex => {
                const option = document.createElement('div');
                option.className = 'exercise-option';
                option.innerHTML = `
                    <div class="exercise-option-name">💪 ${ex.name}</div>
                    <div class="exercise-option-desc">${ex.desc}</div>
                `;
                option.onclick = () => selectExerciseFromBank(ex);
                matchesContainer.appendChild(option);
            });
        }

        function selectExerciseFromBank(exercise) {
            selectedExerciseFromBank = exercise;
            document.getElementById('exerciseName').value = exercise.name;
            document.getElementById('exerciseDesc').value = exercise.desc;
            document.getElementById('exerciseSteps').value = exercise.steps;
            document.getElementById('exerciseTips').value = exercise.tips;
            document.getElementById('exerciseAvoid').value = exercise.avoid;
            document.getElementById('exerciseMatches').classList.add('hidden');
            document.getElementById('matchIndicator').textContent = '✅ Exercício carregado!';
        }

        function openAddModal(dayIdx) {
            currentAddingDayIdx = dayIdx;
            selectedExerciseFromBank = null;
            document.getElementById('exerciseName').value = '';
            document.getElementById('exerciseSets').value = '';
            document.getElementById('exerciseDesc').value = '';
            document.getElementById('exerciseSteps').value = '';
            document.getElementById('exerciseTips').value = '';
            document.getElementById('exerciseAvoid').value = '';
            document.getElementById('exerciseMatches').classList.add('hidden');
            document.getElementById('matchIndicator').textContent = '';
            document.getElementById('addExerciseModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addExerciseModal').classList.remove('show');
            currentAddingDayIdx = null;
            selectedExerciseFromBank = null;
        }

        function confirmAddExercise() {
            const name = document.getElementById('exerciseName').value.trim();
            const sets = document.getElementById('exerciseSets').value.trim();
            
            if (!name || !sets) {
                alert('Nome e Séries obrigatórios!');
                return;
            }
            
            const newExercise = {
                name: name,
                sets: sets,
                video: selectedExerciseFromBank ? selectedExerciseFromBank.video : 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name),
                desc: document.getElementById('exerciseDesc').value || 'Descrição do exercício',
                steps: document.getElementById('exerciseSteps').value || '1. Passo 1\n2. Passo 2',
                tips: document.getElementById('exerciseTips').value || '✓ Dica 1',
                avoid: document.getElementById('exerciseAvoid').value || '✗ Evite 1'
            };
            
            workouts[currentProfile][currentAddingDayIdx].exercises.push(newExercise);
            saveProfileData();
            render();
            closeAddModal();
        }

        function render() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            workouts[currentProfile].forEach((day, dayIdx) => {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.onclick = () => toggleDay(dayIdx);
                header.innerHTML = `
                    <div>
                        <div class="day-title">${day.day}</div>
                        <div class="day-focus">${day.focus}</div>
                    </div>
                    <div class="day-controls">
                        <button class="btn-add" onclick="openAddModal(${dayIdx})">+ Adicionar</button>
                        <span style="margin-left: 10px;">▼</span>
                    </div>
                `;
                dayBox.appendChild(header);

                const content = document.createElement('div');
                content.id = `day${dayIdx}`;
                content.className = 'hidden';

                day.exercises.forEach((ex, exIdx) => {
                    const key = `${dayIdx}-${exIdx}`;

                    const exercise = document.createElement('div');
                    exercise.className = 'exercise';
                    exercise.onclick = () => toggleExercise(dayIdx, exIdx);

                    const checkbox = document.createElement('div');
                    checkbox.className = 'checkbox';
                    checkbox.id = `check${key}`;
                    checkbox.onclick = (e) => {
                        e.stopPropagation();
                        toggleCheck(dayIdx, exIdx);
                    };

                    if (checkedExercises[currentProfile] && checkedExercises[currentProfile][key]) {
                        checkbox.classList.add('checked');
                        checkbox.innerHTML = '✓';
                    }

                    const info = document.createElement('div');
                    info.className = 'exercise-info';
                    info.innerHTML = `
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-sets">${ex.sets}</div>
                    `;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'exercise-delete';
                    deleteBtn.textContent = '✕';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteExercise(dayIdx, exIdx);
                    };

                    exercise.appendChild(checkbox);
                    exercise.appendChild(info);
                    exercise.appendChild(deleteBtn);

                    const details = document.createElement('div');
                    details.className = 'exercise-details';
                    details.id = `details${key}`;
                    details.innerHTML = `
                        <button class="video-btn" onclick="window.open('${ex.video}', '_blank')">
                            📹 Ver Vídeo YouTube
                        </button>
                        <div class="detail-section">
                            <div class="detail-title">📖 Como Fazer:</div>
                            <div>${ex.desc}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">🔢 Passo a Passo:</div>
                            <div style="white-space: pre-wrap;">${ex.steps}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">💡 Dicas:</div>
                            <div style="white-space: pre-wrap;">${ex.tips}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">⚠️ Evite:</div>
                            <div style="white-space: pre-wrap;">${ex.avoid}</div>
                        </div>
                    `;

                    content.appendChild(exercise);
                    content.appendChild(details);
                });

                dayBox.appendChild(content);
                container.appendChild(dayBox);
            });

            updateProgress();
        }

        function renderHistory() {
            const container = document.getElementById('historyCards');
            const history = workoutHistory[currentProfile] || [];
            
            const totalWorkouts = history.length;
            let totalMilliseconds = 0;
            history.forEach(w => {
                totalMilliseconds += w.totalTime;
            });
            
            const totalHours = Math.floor(totalMilliseconds / (1000 * 60 * 60));
            
            document.getElementById('totalWorkouts').textContent = totalWorkouts;
            document.getElementById('totalHours').textContent = totalHours > 0 ? totalHours + 'h' : '<1h';

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Nenhum treino registrado ainda.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            
            const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sorted.forEach(workout => {
                const date = new Date(workout.date);
                const dayName = date.toLocaleDateString('pt-BR', { weekday: 'long' });
                const dateStr = date.toLocaleDateString('pt-BR');
                
                const hours = Math.floor(workout.totalTime / (1000 * 60 * 60));
                const minutes = Math.floor((workout.totalTime % (1000 * 60 * 60)) / (1000 * 60));
                const timeStr = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
                
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-date">${dateStr}</div>
                    <div class="history-day">${dayName.charAt(0).toUpperCase() + dayName.slice(1)}</div>
                    <div class="history-info">
                        <div class="history-info-item">
                            <span>⏱️ ${timeStr}</span>
                        </div>
                        <div class="history-info-item">
                            <span>✓ ${workout.completed}/${workout.total}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleDay(idx) {
            const el = document.getElementById(`day${idx}`);
            el.classList.toggle('hidden');
        }

        function toggleExercise(dayIdx, exIdx) {
            const el = document.getElementById(`details${dayIdx}-${exIdx}`);
            el.classList.toggle('show');
        }

        function updateProgress() {
            let total = 0, checked = 0;
            for (let dayIdx = 0; dayIdx < workouts[currentProfile].length; dayIdx++) {
                for (let exIdx = 0; exIdx < workouts[currentProfile][dayIdx].exercises.length; exIdx++) {
                    total++;
                    const key = `${dayIdx}-${exIdx}`;
                    if (checkedExercises[currentProfile] && checkedExercises[currentProfile][key]) checked++;
                }
            }
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        // INIT
        loadData();
    </script>
