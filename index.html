<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Academia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 20px; text-align: center; }

        /* LOGIN SCREEN */
        .login-screen { display: none; }
        .login-screen.show { display: block; }
        .login-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 30px;
            color: #4CAF50;
        }
        .profiles-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .profile-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .profile-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
        }
        .profile-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .btn-new-profile {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
        .btn-new-profile:hover { background: #45a049; }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }
        .modal.show { display: block; }
        .modal-content {
            background-color: #2a2a2a;
            margin: 20% auto;
            padding: 30px;
            border: 1px solid #444;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            font-family: inherit;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn-confirm {
            flex: 1;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-confirm:hover { background: #45a049; }
        .btn-cancel {
            flex: 1;
            background: #555;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cancel:hover { background: #666; }

        /* APP SCREEN */
        .app-screen { display: none; }
        .app-screen.show { display: block; }

        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .profile-display { text-align: left; }
        .profile-label { font-size: 12px; opacity: 0.8; }
        .profile-name-header { font-size: 18px; font-weight: bold; }
        .btn-switch-profile {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-switch-profile:hover { background: rgba(255, 255, 255, 0.3); }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #333;
            overflow-x: auto;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #aaa;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .tab-btn.active {
            color: #4CAF50;
            border-bottom-color: #4CAF50;
        }
        .tab-btn:hover { color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* TIMER SECTION */
        .timer-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .timer-display {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }
        .timer-label { font-size: 14px; opacity: 0.9; margin-bottom: 15px; }
        .timer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-start {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-start:hover { background: #45a049; }
        .btn-end {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-end:hover { background: #da190b; }
        .btn-end:disabled { background: #ccc; cursor: not-allowed; }

        .progress-bar { 
            background: #333; 
            height: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .rest-timer {
            background: #ff9800;
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
            display: none;
            font-family: 'Courier New', monospace;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }
        .rest-timer.active { display: block; }

        /* DAY BOX */
        .day-box {
            background: #2a2a2a;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .day-header {
            background: #333;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-header:hover { background: #3a3a3a; }
        .day-title { font-weight: bold; font-size: 16px; }
        .day-focus { font-size: 12px; color: #aaa; }

        .exercise {
            border-top: 1px solid #444;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            position: relative;
        }
        .exercise:hover { background: #333; }
        .exercise-buttons {
            position: absolute;
            top: 12px;
            right: 15px;
            display: flex;
            gap: 5px;
        }
        .btn-replace {
            background: #FF9800;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-replace:hover { background: #F57C00; }
        .btn-delete {
            background: #f44336;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-delete:hover { background: #da190b; }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            font-size: 14px;
            background: #333;
            transition: all 0.2s;
        }
        .checkbox:hover { border-color: #4CAF50; }
        .checkbox.checked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }

        .exercise-info { 
            flex: 1;
            cursor: pointer;
        }
        .exercise-name { font-weight: bold; font-size: 14px; }
        .exercise-sets { font-size: 12px; color: #aaa; }

        .exercise-details {
            display: none;
            background: #1a1a1a;
            padding: 15px;
            border-top: 1px solid #444;
            font-size: 13px;
            line-height: 1.6;
        }
        .exercise-details.show { display: block; }

        .exercise-image {
            width: 100%;
            height: 250px;
            background: #333;
            border-radius: 6px;
            margin-bottom: 15px;
            object-fit: cover;
            display: block;
        }

        .detail-section { margin-bottom: 15px; }
        .detail-title { font-weight: bold; color: #4CAF50; margin-bottom: 8px; }

        .video-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        .video-btn:hover { background: #cc0000; }

        .hidden { display: none; }

        /* HISTÓRICO */
        .history-stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.3);
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 12px;
            color: #ddd;
        }

        .history-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .history-card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #4CAF50;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .history-date {
            font-size: 12px;
            color: #4CAF50;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .history-day {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .history-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .history-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        /* EXERCISE SELECTOR */
        .exercises-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .exercise-option {
            background: #333;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid #444;
            transition: all 0.3s;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .exercise-option:hover {
            border-color: #4CAF50;
            background: #3a3a3a;
        }
        .exercise-option-img {
            width: 80px;
            height: 80px;
            background: #444;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .exercise-option-content { flex: 1; }
        .exercise-option-name {
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .exercise-option-desc {
            font-size: 11px;
            color: #999;
            line-height: 1.4;
        }

        .category-filter {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .category-btn {
            background: #333;
            color: #aaa;
            border: 1px solid #555;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .category-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }
        .category-btn:hover {
            border-color: #4CAF50;
            color: #4CAF50;
        }

        .current-exercise-info {
            background: #333;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border-left: 4px solid #FF9800;
        }
        .current-label {
            font-size: 12px;
            color: #FF9800;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .current-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .current-sets {
            font-size: 12px;
            color: #aaa;
        }

        /* EXERCÍCIOS ABA */
        .btn-create-exercise {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
        }
        .btn-create-exercise:hover { background: #45a049; }

        .exercises-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .exercise-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            position: relative;
            overflow: hidden;
        }
        .exercise-card-image {
            width: 100%;
            height: 180px;
            background: #333;
            border-radius: 4px;
            margin-bottom: 10px;
            object-fit: cover;
        }
        .exercise-card-name {
            font-weight: bold;
            font-size: 16px;
            color: #4CAF50;
            margin-bottom: 8px;
        }
        .exercise-card-category {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .exercise-card-desc {
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        .exercise-card-buttons {
            display: flex;
            gap: 10px;
            position: absolute;
            top: 15px;
            right: 15px;
        }
        .btn-edit {
            background: #2196F3;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-edit:hover { background: #0b7dda; }
        .btn-remove {
            background: #f44336;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-remove:hover { background: #da190b; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen show">
        <div class="container">
            <div class="login-title">💪 Academia</div>
            <div class="profiles-list" id="profilesList"></div>
            <button class="btn-new-profile" onclick="openNewProfileModal()">➕ Novo Perfil</button>
        </div>
    </div>

    <!-- APP SCREEN -->
    <div id="appScreen" class="app-screen">
        <div class="container">
            <h1>💪 Seu Treino</h1>
            
            <div class="app-header">
                <div class="profile-display">
                    <div class="profile-label">👤 Perfil</div>
                    <div class="profile-name-header" id="currentProfileName"></div>
                </div>
                <button class="btn-switch-profile" onclick="switchProfile()">Trocar Perfil</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('workout')">📅 Treino</button>
                <button class="tab-btn" onclick="switchTab('history')">📊 Histórico</button>
                <button class="tab-btn" onclick="switchTab('exercises')">💪 Exercícios</button>
            </div>

            <!-- TAB TREINO -->
            <div id="workout" class="tab-content active">
                <div class="timer-section">
                    <div class="timer-label">⏱️ Tempo Total de Academia</div>
                    <div class="timer-display" id="timerDisplay">00:00:00</div>
                    <div class="timer-buttons">
                        <button class="btn-start" id="btnStart" onclick="startWorkout()">▶️ Iniciar</button>
                        <button class="btn-end" id="btnEnd" onclick="endWorkout()" disabled>🛑 Encerrar</button>
                    </div>
                </div>

                <div class="rest-timer" id="restTimer"></div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <div id="workoutContainer"></div>
            </div>

            <!-- TAB HISTÓRICO -->
            <div id="history" class="tab-content">
                <div class="history-stats">
                    <div class="stat-card">
                        <div class="stat-number" id="totalWorkouts">0</div>
                        <div class="stat-label">Treinos</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalHours">0h</div>
                        <div class="stat-label">Tempo Total</div>
                    </div>
                </div>

                <div id="historyCards" class="history-cards"></div>
            </div>

            <!-- TAB EXERCÍCIOS -->
            <div id="exercises" class="tab-content">
                <button class="btn-create-exercise" onclick="openCreateExerciseModal()">➕ Criar Novo Exercício</button>
                <div class="exercises-list" id="exercisesList"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NOVO PERFIL -->
    <div id="newProfileModal" class="modal">
        <div class="modal-content">
            <h2>➕ Novo Perfil</h2>
            <div class="form-group">
                <label>Nome do Perfil *</label>
                <input type="text" id="newProfileName" placeholder="Ex: João, Maria, etc">
            </div>
            <div class="form-buttons">
                <button class="btn-confirm" onclick="createProfile()">✓ Criar</button>
                <button class="btn-cancel" onclick="closeNewProfileModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL CRIAR/EDITAR EXERCÍCIO -->
    <div id="createExerciseModal" class="modal">
        <div class="modal-content">
            <h2 id="createExerciseTitle">➕ Criar Novo Exercício</h2>
            
            <div class="form-group">
                <label>Nome do Exercício *</label>
                <input type="text" id="createExName" placeholder="Ex: Meu Exercício">
            </div>

            <div class="form-group">
                <label>Categoria *</label>
                <select id="createExCategory">
                    <option value="">Escolha uma categoria</option>
                    <option value="Peito">Peito</option>
                    <option value="Costas">Costas</option>
                    <option value="Bíceps">Bíceps</option>
                    <option value="Tríceps">Tríceps</option>
                    <option value="Ombro">Ombro</option>
                    <option value="Perna">Perna</option>
                    <option value="Cardio">Cardio</option>
                    <option value="Core">Core</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label>Descrição *</label>
                <textarea id="createExDesc" placeholder="Como fazer o exercício"></textarea>
            </div>

            <div class="form-group">
                <label>Passo a Passo *</label>
                <textarea id="createExSteps" placeholder="1. Passo 1&#10;2. Passo 2"></textarea>
            </div>

            <div class="form-group">
                <label>Dicas</label>
                <textarea id="createExTips" placeholder="✓ Dica 1&#10;✓ Dica 2"></textarea>
            </div>

            <div class="form-group">
                <label>Evite</label>
                <textarea id="createExAvoid" placeholder="✗ Evite 1&#10;✗ Evite 2"></textarea>
            </div>

            <div class="form-group">
                <label>Link YouTube (opcional)</label>
                <input type="text" id="createExVideo" placeholder="https://youtube.com/...">
            </div>

            <div class="form-buttons">
                <button class="btn-confirm" onclick="saveCustomExercise()">✓ Salvar</button>
                <button class="btn-cancel" onclick="closeCreateExerciseModal()">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL TROCAR EXERCÍCIO -->
    <div id="selectExerciseModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">🔄 Trocar Exercício</h2>
            
            <div id="currentExerciseContainer" class="current-exercise-info">
                <div class="current-label">⚙️ Exercício Atual</div>
                <div class="current-name" id="currentExerciseName"></div>
                <div class="current-sets" id="currentExerciseSets"></div>
            </div>

            <div class="form-group">
                <label>🔍 Filtrar por Categoria</label>
                <div class="category-filter" id="categoryFilter"></div>
            </div>

            <div class="form-group">
                <label>Exercícios Disponíveis</label>
                <div class="exercises-grid" id="exercisesGrid"></div>
            </div>

            <div class="form-buttons">
                <button class="btn-cancel" onclick="closeSelectModal()" style="flex: 1;">✕ Cancelar</button>
            </div>

                    { ...exerciseBank.find(e => e.name === "Pullover"), sets: "3 x 8-10" }
                ]
            },
            {
                day: "Quarta",
                focus: "Perna",
                exercises: [
                    { ...exerciseBank.find(e => e.name === "Agachamento"), sets: "4 x 6-8" },
                    { ...exerciseBank.find(e => e.name === "Leg Press"), sets: "3 x 10-12" },
                    { ...exerciseBank.find(e => e.name === "Extensora"), sets: "3 x 12-15" },
                    { ...exerciseBank.find(e => e.name === "Cadeira Adutora"), sets: "3 x 12-15" },
                    { ...exerciseBank.find(e => e.name === "Rosca de Perna"), sets: "3 x 12-15" }
                ]
            },
            {
                day: "Quinta",
                focus: "Ombro & Braço",
                exercises: [
                    { ...exerciseBank.find(e => e.name === "Desenvolvimento"), sets: "4 x 8-10" },
                    { ...exerciseBank.find(e => e.name === "Elevação Lateral"), sets: "3 x 12-15" },
                    { ...exerciseBank.find(e => e.name === "Elevação Frontal"), sets: "3 x 12-15" },
                    { ...exerciseBank.find(e => e.name === "Shrug"), sets: "3 x 10-12" },
                    { ...exerciseBank.find(e => e.name === "Rosca Inversa"), sets: "3 x 8-10" }
                ]
            },
            {
                day: "Sexta",
                focus: "Cardio HIIT + Core",
                exercises: [
                    { ...exerciseBank.find(e => e.name === "Aquecimento"), sets: "1 x 5 min" },
                    { ...exerciseBank.find(e => e.name === "HIIT"), sets: "8 x (30s/30s)" },
                    { ...exerciseBank.find(e => e.name === "Prancha"), sets: "3 x 30-60s" },
                    { ...exerciseBank.find(e => e.name === "Abdominal Dinâmico"), sets: "3 x 15-20" },
                    { ...exerciseBank.find(e => e.name === "Mountain Climbers"), sets: "3 x 20-30s" }
                ]
            }
        ];

        // ===== PROFILE MANAGEMENT =====
        function loadData() {
            const savedProfiles = localStorage.getItem('profiles');
            const current = localStorage.getItem('currentProfile');
            
            if (savedProfiles) {
                profiles = JSON.parse(savedProfiles);
            }
            if (current) {
                currentProfile = current;
            }
            
            renderProfilesScreen();
        }

        function renderProfilesScreen() {
            const container = document.getElementById('profilesList');
            container.innerHTML = '';
            
            if (profiles.length === 0) {
                document.getElementById('loginScreen').classList.add('show');
                document.getElementById('appScreen').classList.remove('show');
                return;
            }
            
            profiles.forEach(profile => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.innerHTML = `
                    <div class="profile-name">👤 ${profile}</div>
                    <div style="font-size: 12px; opacity: 0.8;">Clique para entrar</div>
                `;
                card.onclick = () => selectProfile(profile);
                container.appendChild(card);
            });
        }

        function selectProfile(profileName) {
            currentProfile = profileName;
            localStorage.setItem('currentProfile', profileName);
            loadProfileData();
            showAppScreen();
        }

        function loadProfileData() {
            const prefix = `profile_${currentProfile}_`;
            
            const savedWorkouts = localStorage.getItem(prefix + 'workouts');
            workouts[currentProfile] = savedWorkouts ? JSON.parse(savedWorkouts) : JSON.parse(JSON.stringify(defaultWorkouts));
            
            const savedChecked = localStorage.getItem(prefix + 'checkedExercises');
            checkedExercises[currentProfile] = savedChecked ? JSON.parse(savedChecked) : {};
            
            const savedHistory = localStorage.getItem(prefix + 'workoutHistory');
            workoutHistory[currentProfile] = savedHistory ? JSON.parse(savedHistory) : [];
            
            const savedCustom = localStorage.getItem(prefix + 'customExercises');
            customExercises[currentProfile] = savedCustom ? JSON.parse(savedCustom) : [];
        }

        function saveProfileData() {
            const prefix = `profile_${currentProfile}_`;
            localStorage.setItem(prefix + 'workouts', JSON.stringify(workouts[currentProfile]));
            localStorage.setItem(prefix + 'checkedExercises', JSON.stringify(checkedExercises[currentProfile]));
            localStorage.setItem(prefix + 'workoutHistory', JSON.stringify(workoutHistory[currentProfile]));
            localStorage.setItem(prefix + 'customExercises', JSON.stringify(customExercises[currentProfile]));
        }

        function openNewProfileModal() {
            document.getElementById('newProfileModal').classList.add('show');
        }

        function closeNewProfileModal() {
            document.getElementById('newProfileModal').classList.remove('show');
            document.getElementById('newProfileName').value = '';
        }

        function createProfile() {
            const name = document.getElementById('newProfileName').value.trim();
            
            if (!name) {
                alert('Nome obrigatório!');
                return;
            }
            
            if (profiles.includes(name)) {
                alert('Perfil já existe!');
                return;
            }
            
            profiles.push(name);
            localStorage.setItem('profiles', JSON.stringify(profiles));
            closeNewProfileModal();
            renderProfilesScreen();
        }

        function switchProfile() {
            saveProfileData();
            currentProfile = null;
            document.getElementById('loginScreen').classList.add('show');
            document.getElementById('appScreen').classList.remove('show');
            renderProfilesScreen();
        }

        function showAppScreen() {
            document.getElementById('loginScreen').classList.remove('show');
            document.getElementById('appScreen').classList.add('show');
            document.getElementById('currentProfileName').textContent = currentProfile;
            render();
        }

        // ===== APP FUNCTIONS =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'history') {
                renderHistory();
            } else if (tab === 'exercises') {
                renderExercisesTab();
            }
        }

        function startWorkout() {
            if (!isWorkoutActive) {
                workoutStartTime = Date.now();
                isWorkoutActive = true;
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnEnd').disabled = false;
                startTimer();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            if (!workoutStartTime || !isWorkoutActive) return;
            const elapsed = Date.now() - workoutStartTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const display = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = display;
        }

        function endWorkout() {
            if (!isWorkoutActive) return;
            clearInterval(timerInterval);
            isWorkoutActive = false;
            
            const elapsed = Date.now() - workoutStartTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const display = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            
            const completedCount = Object.keys(checkedExercises[currentProfile]).length;
            const totalExercises = workouts[currentProfile].reduce((sum, day) => sum + day.exercises.length, 0);
            
            workoutHistory[currentProfile].push({
                date: new Date().toISOString(),
                totalTime: elapsed,
                completed: completedCount,
                total: totalExercises
            });
            
            saveProfileData();
            
            document.getElementById('finalTime').textContent = display;
            document.getElementById('finishModal').classList.add('show');
            
            checkedExercises[currentProfile] = {};
            render();
            
            let countDown = 3;
            document.getElementById('modalTimer').textContent = `Fechando em ${countDown}s...`;
            
            modalCloseTimer = setInterval(() => {
                countDown--;
                if (countDown > 0) {
                    document.getElementById('modalTimer').textContent = `Fechando em ${countDown}s...`;
                } else {
                    clearInterval(modalCloseTimer);
                    closeFinishModal();
                }
            }, 1000);
            
            resetWorkout();
        }

        function closeFinishModal() {
            if (modalCloseTimer) clearInterval(modalCloseTimer);
            document.getElementById('finishModal').classList.remove('show');
        }

        function resetWorkout() {
            workoutStartTime = null;
            isWorkoutActive = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnEnd').disabled = true;
            document.getElementById('timerDisplay').textContent = '00:00:00';
        }

        function startRestTimer() {
            if (restTimerInterval) clearInterval(restTimerInterval);
            let restSeconds = 60;
            const restEl = document.getElementById('restTimer');
            restEl.classList.add('active');
            restEl.textContent = `⏳ Descanso: ${restSeconds}s`;
            
            restTimerInterval = setInterval(() => {
                if (restSeconds > 0) {
                    restEl.textContent = `⏳ Descanso: ${restSeconds}s`;
                    restSeconds--;
                } else {
                    clearInterval(restTimerInterval);
                    restEl.classList.remove('active');
                }
            }, 1000);
        }

        function toggleCheck(dayIdx, exIdx) {
            const key = `${dayIdx}-${exIdx}`;
            const el = document.getElementById(`check${key}`);
            
            if (!el.classList.contains('checked')) {
                el.classList.add('checked');
                el.innerHTML = '✓';
                checkedExercises[currentProfile][key] = true;
                startRestTimer();
            } else {
                el.classList.remove('checked');
                el.innerHTML = '';
                delete checkedExercises[currentProfile][key];
            }
            
            saveProfileData();
            updateProgress();
        }

        function deleteExercise(dayIdx, exIdx) {
            if (confirm('Deletar exercício?')) {
                workouts[currentProfile][dayIdx].exercises.splice(exIdx, 1);
                saveProfileData();
                render();
            }
        }

        function replaceExercise(dayIdx, exIdx) {
            currentAddingDayIdx = dayIdx;
            currentAddingExIdx = exIdx;
            selectedCategory = 'todas';
            openSelectModal();
        }

        function openSelectModal() {
            document.getElementById('selectExerciseModal').classList.add('show');
            
            const current = workouts[currentProfile][currentAddingDayIdx].exercises[currentAddingExIdx];
            document.getElementById('currentExerciseName').textContent = current.name;
            document.getElementById('currentExerciseSets').textContent = current.sets;
            
            renderCategories();
            filterExercises('todas');
        }

        function closeSelectModal() {
            document.getElementById('selectExerciseModal').classList.remove('show');
            currentAddingDayIdx = null;
            currentAddingExIdx = null;
        }

        function renderCategories() {
            const container = document.getElementById('categoryFilter');
            container.innerHTML = '';
            
            const btn = document.createElement('button');
            btn.className = 'category-btn' + (selectedCategory === 'todas' ? ' active' : '');
            btn.textContent = 'Todas';
            btn.onclick = () => filterExercises('todas');
            container.appendChild(btn);
            
            Object.keys(exerciseCategories).forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'category-btn' + (selectedCategory === category ? ' active' : '');
                btn.textContent = category;
                btn.onclick = () => filterExercises(category);
                container.appendChild(btn);
            });
        }

        function filterExercises(category) {
            selectedCategory = category;
            renderCategories();
            
            let exercises = [...exerciseBank, ...customExercises[currentProfile]];
            if (category !== 'todas') {
                exercises = exercises.filter(ex => ex.category === category);
            }
            
            const container = document.getElementById('exercisesGrid');
            container.innerHTML = '';
            
            exercises.forEach(ex => {
                const option = document.createElement('div');
                option.className = 'exercise-option';
                
                const imageUrl = exerciseImages[ex.name] || 'https://via.placeholder.com/80?text=Sem+Imagem';
                
                option.innerHTML = `
                    <img src="${imageUrl}" alt="${ex.name}" class="exercise-option-img" onerror="this.src='https://via.placeholder.com/80?text=Sem+Imagem'">
                    <div class="exercise-option-content">
                        <div class="exercise-option-name">${ex.name}</div>
                        <div class="exercise-option-desc">${ex.desc}</div>
                    </div>
                `;
                option.onclick = () => selectExercise(ex);
                container.appendChild(option);
            });
        }

        function selectExercise(exercise) {
            const sets = workouts[currentProfile][currentAddingDayIdx].exercises[currentAddingExIdx].sets;
            workouts[currentProfile][currentAddingDayIdx].exercises[currentAddingExIdx] = {
                ...exercise,
                sets: sets
            };
            
            saveProfileData();
            render();
            closeSelectModal();
        }

        // ===== EXERCÍCIOS ABA =====
        function openCreateExerciseModal() {
            editingExerciseId = null;
            document.getElementById('createExerciseTitle').textContent = '➕ Criar Novo Exercício';
            document.getElementById('createExName').value = '';
            document.getElementById('createExCategory').value = '';
            document.getElementById('createExDesc').value = '';
            document.getElementById('createExSteps').value = '';
            document.getElementById('createExTips').value = '';
            document.getElementById('createExAvoid').value = '';
            document.getElementById('createExVideo').value = '';
            document.getElementById('createExerciseModal').classList.add('show');
        }

        function closeCreateExerciseModal() {
            document.getElementById('createExerciseModal').classList.remove('show');
            editingExerciseId = null;
        }

        function saveCustomExercise() {
            const name = document.getElementById('createExName').value.trim();
            const category = document.getElementById('createExCategory').value;
            const desc = document.getElementById('createExDesc').value.trim();
            const steps = document.getElementById('createExSteps').value.trim();
            
            if (!name || !category || !desc || !steps) {
                alert('Preencha todos os campos obrigatórios!');
                return;
            }
            
            const newExercise = {
                id: Date.now(),
                name: name,
                category: category,
                desc: desc,
                steps: steps,
                tips: document.getElementById('createExTips').value || '✓ Dica',
                avoid: document.getElementById('createExAvoid').value || '✗ Evite',
                video: document.getElementById('createExVideo').value || 'https://youtube.com'
            };
            
            if (editingExerciseId) {
                const idx = customExercises[currentProfile].findIndex(ex => ex.id === editingExerciseId);
                customExercises[currentProfile][idx] = newExercise;
            } else {
                customExercises[currentProfile].push(newExercise);
            }
            
            saveProfileData();
            renderExercisesTab();
            closeCreateExerciseModal();
        }

        function renderExercisesTab() {
            const container = document.getElementById('exercisesList');
            const allExercises = [...exerciseBank, ...customExercises[currentProfile]];
            
            container.innerHTML = '';
            
            allExercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                
                const imageUrl = exerciseImages[ex.name] || 'https://via.placeholder.com/300x180?text=Sem+Imagem';
                
                card.innerHTML = `
                    <img src="${imageUrl}" alt="${ex.name}" class="exercise-card-image" onerror="this.src='https://via.placeholder.com/300x180?text=Sem+Imagem'">
                    <div class="exercise-card-name">${ex.name}</div>
                    <div class="exercise-card-category">${ex.category}</div>
                    <div class="exercise-card-desc">${ex.desc}</div>
                    <div class="exercise-card-buttons">
                        ${customExercises[currentProfile].some(c => c.id === ex.id) ? `
                            <button class="btn-edit" title="Editar" onclick="editCustomExercise(${ex.id})">✎</button>
                            <button class="btn-remove" title="Remover" onclick="removeCustomExercise(${ex.id})">✕</button>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function editCustomExercise(id) {
            const exercise = customExercises[currentProfile].find(ex => ex.id === id);
            if (!exercise) return;
            
            editingExerciseId = id;
            document.getElementById('createExerciseTitle').textContent = '✎ Editar Exercício';
            document.getElementById('createExName').value = exercise.name;
            document.getElementById('createExCategory').value = exercise.category;
            document.getElementById('createExDesc').value = exercise.desc;
            document.getElementById('createExSteps').value = exercise.steps;
            document.getElementById('createExTips').value = exercise.tips;
            document.getElementById('createExAvoid').value = exercise.avoid;
            document.getElementById('createExVideo').value = exercise.video;
            document.getElementById('createExerciseModal').classList.add('show');
        }

        function removeCustomExercise(id) {
            if (confirm('Remover este exercício?')) {
                const idx = customExercises[currentProfile].findIndex(ex => ex.id === id);
                customExercises[currentProfile].splice(idx, 1);
                saveProfileData();
                renderExercisesTab();
            }
        }

        function render() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            workouts[currentProfile].forEach((day, dayIdx) => {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.onclick = () => toggleDay(dayIdx);
                header.innerHTML = `
                    <div>
                        <div class="day-title">${day.day}</div>
                        <div class="day-focus">${day.focus}</div>
                    </div>
                    <div class="day-controls">
                        <span style="margin-left: 10px;">▼</span>
                    </div>
                `;
                dayBox.appendChild(header);

                const content = document.createElement('div');
                content.id = `day${dayIdx}`;
                content.className = 'hidden';

                day.exercises.forEach((ex, exIdx) => {
                    const key = `${dayIdx}-${exIdx}`;

                    const exercise = document.createElement('div');
                    exercise.className = 'exercise';
                    exercise.onclick = () => toggleExercise(dayIdx, exIdx);

                    const checkbox = document.createElement('div');
                    checkbox.className = 'checkbox';
                    checkbox.id = `check${key}`;
                    checkbox.onclick = (e) => {
                        e.stopPropagation();
                        toggleCheck(dayIdx, exIdx);
                    };

                    if (checkedExercises[currentProfile] && checkedExercises[currentProfile][key]) {
                        checkbox.classList.add('checked');
                        checkbox.innerHTML = '✓';
                    }

                    const info = document.createElement('div');
                    info.className = 'exercise-info';
                    info.innerHTML = `
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-sets">${ex.sets}</div>
                    `;

                    const buttons = document.createElement('div');
                    buttons.className = 'exercise-buttons';
                    
                    const replaceBtn = document.createElement('button');
                    replaceBtn.className = 'btn-replace';
                    replaceBtn.textContent = '🔄';
                    replaceBtn.title = 'Trocar exercício';
                    replaceBtn.onclick = (e) => {
                        e.stopPropagation();
                        replaceExercise(dayIdx, exIdx);
                    };
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'btn-delete';
                    deleteBtn.textContent = '✕';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteExercise(dayIdx, exIdx);
                    };
                    
                    buttons.appendChild(replaceBtn);
                    buttons.appendChild(deleteBtn);

                    exercise.appendChild(checkbox);
                    exercise.appendChild(info);
                    exercise.appendChild(buttons);

                    const details = document.createElement('div');
                    details.className = 'exercise-details';
                    details.id = `details${key}`;
                    
                    const imageUrl = exerciseImages[ex.name] || 'https://via.placeholder.com/600x400?text=Sem+Imagem';
                    
                    details.innerHTML = `
                        <img src="${imageUrl}" alt="${ex.name}" class="exercise-image" onerror="this.src='https://via.placeholder.com/600x400?text=Sem+Imagem'">
                        <button class="video-btn" onclick="window.open('${ex.video}', '_blank')">
                            📹 Ver Vídeo YouTube
                        </button>
                        <div class="detail-section">
                            <div class="detail-title">📖 Como Fazer:</div>
                            <div>${ex.desc}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">🔢 Passo a Passo:</div>
                            <div style="white-space: pre-wrap;">${ex.steps}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">💡 Dicas:</div>
                            <div style="white-space: pre-wrap;">${ex.tips}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">⚠️ Evite:</div>
                            <div style="white-space: pre-wrap;">${ex.avoid}</div>
                        </div>
                    `;

                    content.appendChild(exercise);
                    content.appendChild(details);
                });

                dayBox.appendChild(content);
                container.appendChild(dayBox);
            });

            updateProgress();
        }

        function renderHistory() {
            const container = document.getElementById('historyCards');
            const history = workoutHistory[currentProfile] || [];
            
            const totalWorkouts = history.length;
            let totalMilliseconds = 0;
            history.forEach(w => {
                totalMilliseconds += w.totalTime;
            });
            
            const totalHours = Math.floor(totalMilliseconds / (1000 * 60 * 60));
            
            document.getElementById('totalWorkouts').textContent = totalWorkouts;
            document.getElementById('totalHours').textContent = totalHours > 0 ? totalHours + 'h' : '<1h';

            if (history.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 10px;">📋</div>
                        <p>Nenhum treino registrado ainda.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            
            const sorted = [...history].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            sorted.forEach(workout => {
                const date = new Date(workout.date);
                const dayName = date.toLocaleDateString('pt-BR', { weekday: 'long' });
                const dateStr = date.toLocaleDateString('pt-BR');
                
                const hours = Math.floor(workout.totalTime / (1000 * 60 * 60));
                const minutes = Math.floor((workout.totalTime % (1000 * 60 * 60)) / (1000 * 60));
                const timeStr = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
                
                const card = document.createElement('div');
                card.className = 'history-card';
                card.innerHTML = `
                    <div class="history-date">${dateStr}</div>
                    <div class="history-day">${dayName.charAt(0).toUpperCase() + dayName.slice(1)}</div>
                    <div class="history-info">
                        <div class="history-info-item">
                            <span>⏱️ ${timeStr}</span>
                        </div>
                        <div class="history-info-item">
                            <span>✓ ${workout.completed}/${workout.total}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleDay(idx) {
            const el = document.getElementById(`day${idx}`);
            el.classList.toggle('hidden');
        }

        function toggleExercise(dayIdx, exIdx) {
            const el = document.getElementById(`details${dayIdx}-${exIdx}`);
            el.classList.toggle('show');
        }

        function updateProgress() {
            let total = 0, checked = 0;
            for (let dayIdx = 0; dayIdx < workouts[currentProfile].length; dayIdx++) {
                for (let exIdx = 0; exIdx < workouts[currentProfile][dayIdx].exercises.length; exIdx++) {
                    total++;
                    const key = `${dayIdx}-${exIdx}`;
                    if (checkedExercises[currentProfile] && checkedExercises[currentProfile][key]) checked++;
                }
            }
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        loadData();
    </script>
</body>
</html>
