<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Academia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 10px; }
        .timer-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
        }
        .timer-display {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }
        .timer-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 15px;
        }
        .timer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn-start {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-start:hover { background: #45a049; }
        .btn-end {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
        }
        .btn-end:hover { background: #da190b; }
        .btn-end:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .progress-bar { 
            background: #333; 
            height: 20px; 
            border-radius: 10px; 
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }
        .rest-timer {
            background: #ff9800;
            color: white;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 10px;
            display: none;
            font-family: 'Courier New', monospace;
        }
        .rest-timer.active {
            display: block;
        }
        .day-box {
            background: #2a2a2a;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .day-header {
            background: #333;
            padding: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .day-header:hover { background: #3a3a3a; }
        .day-title { font-weight: bold; font-size: 16px; }
        .day-focus { font-size: 12px; color: #aaa; }
        .day-controls {
            display: flex;
            gap: 5px;
        }
        .btn-add {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .btn-add:hover { background: #0b7dda; }
        .exercise {
            border-top: 1px solid #444;
            padding: 12px 15px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            position: relative;
        }
        .exercise:hover { background: #333; }
        .exercise-delete {
            position: absolute;
            top: 12px;
            right: 15px;
            background: #f44336;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .exercise-delete:hover { background: #da190b; }
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            font-size: 14px;
            background: #333;
            transition: all 0.2s;
        }
        .checkbox:hover {
            border-color: #4CAF50;
        }
        .checkbox.checked {
            background: #4CAF50;
            border-color: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .exercise-info { 
            flex: 1;
            cursor: pointer;
        }
        .exercise-name { font-weight: bold; font-size: 14px; }
        .exercise-sets { font-size: 12px; color: #aaa; }
        .exercise-details {
            display: none;
            background: #1a1a1a;
            padding: 15px;
            border-top: 1px solid #444;
            font-size: 13px;
            line-height: 1.6;
        }
        .exercise-details.show { display: block; }
        .detail-section { margin-bottom: 15px; }
        .detail-title { font-weight: bold; color: #4CAF50; margin-bottom: 8px; }
        .video-btn {
            background: #ff0000;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .video-btn:hover { background: #cc0000; }
        .hidden { display: none; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            overflow-y: auto;
        }
        .modal.show { display: block; }
        .modal-content {
            background-color: #2a2a2a;
            margin: 10% auto;
            padding: 30px;
            border: 1px solid #444;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .modal-content h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        .modal-content p {
            font-size: 16px;
            margin-bottom: 30px;
        }
        .modal-content button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        .modal-content button:hover { background: #45a049; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 Seu Treino</h1>
        
        <!-- Timer Section -->
        <div class="timer-section">
            <div class="timer-label">⏱️ Tempo Total de Academia</div>
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            <div class="timer-buttons">
                <button class="btn-start" id="btnStart" onclick="startWorkout()">▶️ Iniciar</button>
                <button class="btn-end" id="btnEnd" onclick="endWorkout()" disabled>🛑 Encerrar</button>
            </div>
        </div>

        <!-- Rest Timer -->
        <div class="rest-timer" id="restTimer"></div>

        <!-- Progress -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="workoutContainer"></div>
    </div>

    <!-- Modal de Conclusão -->
    <div id="finishModal" class="modal">
        <div class="modal-content">
            <h2>🎉 Treino Concluído!</h2>

            <p>Parabéns! Você treinou muito bem! 💪</p>
            <button onclick="closeModal()">Novo Treino</button>
        </div>
    </div>

                    { name: "Prancha", sets: "3 x 30-60 seg", video: "https://www.youtube.com/results?search_query=prancha+plank+core+forma+correta", desc: "Corpo reto. Cotovelos sob ombros. Contraia abdômen.", steps: "1. Deite-se de bruços\n2. Cotovelos sob ombros\n3. Levante corpo\n4. Apoie cotovelos/pés\n5. Linha reta\n6. Contraia abdômen\n7. Mantenha respiração", tips: "✓ Qualidade > quantidade\n✓ Contraia CORE\n✓ Respiração constante", avoid: "✗ Sem deixar cair\n✗ Sem prender respiração" },
                    { name: "Abdominal Dinâmico", sets: "3 x 15-20", video: "https://www.youtube.com/results?search_query=abdominal+dinâmico+forma+correta", desc: "Deitado de costas. Joelhos flexionados. Levante o tronco com contração.", steps: "1. Deite de costas\n2. Joelhos flexionados\n3. Pés apoiados\n4. Coloque mãos atrás cabeça\n5. Levante tronco\n6. Máxima contração\n7. Abaixe controlado", tips: "✓ Contração máxima\n✓ Movimento lento\n✓ Foco no abdômen", avoid: "✗ Sem puxar pescoço\n✗ Sem impulso" },
                    { name: "Mountain Climbers", sets: "3 x 20-30 seg", video: "https://www.youtube.com/results?search_query=mountain+climbers+cardio+forma+correta", desc: "Posição de flexão. Alterne trazendo joelhos ao peito rápido.", steps: "1. Posição de flexão\n2. Corpo reto\n3. Traga joelho esquerdo\n4. Retorne rápido\n5. Traga joelho direito\n6. Mantenha ritmo\n7. 20-30 segundos", tips: "✓ Movimento rápido\n✓ Cardio + core\n✓ Máximo esforço", avoid: "✗ Sem deixar quadril cair\n✗ Sem manter corpo reto" }
                ]
            }
        ];

        function loadState() {
            const saved = localStorage.getItem('workouts');
            const savedChecked = localStorage.getItem('checkedExercises');
            if (saved) {
                window.workouts = JSON.parse(saved);
            } else {
                window.workouts = JSON.parse(JSON.stringify(defaultWorkouts));
            }
            if (savedChecked) {
                checkedExercises = JSON.parse(savedChecked);
            }
            const savedStartTime = localStorage.getItem('workoutStartTime');
            if (savedStartTime) {
                workoutStartTime = parseInt(savedStartTime);
                isWorkoutActive = true;
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnEnd').disabled = false;
                startTimer();
            }
        }

        function saveState() {
            localStorage.setItem('workouts', JSON.stringify(window.workouts));
            localStorage.setItem('checkedExercises', JSON.stringify(checkedExercises));
        }

        function startWorkout() {
            if (!isWorkoutActive) {
                workoutStartTime = Date.now();
                isWorkoutActive = true;
                localStorage.setItem('workoutStartTime', workoutStartTime);
                document.getElementById('btnStart').disabled = true;
                document.getElementById('btnEnd').disabled = false;
                startTimer();
            }
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            if (!workoutStartTime || !isWorkoutActive) return;
            const elapsed = Date.now() - workoutStartTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const display = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = display;
        }

        function endWorkout() {
            if (!isWorkoutActive) return;
            clearInterval(timerInterval);
            isWorkoutActive = false;
            const elapsed = Date.now() - workoutStartTime;
            const totalSeconds = Math.floor(elapsed / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            const display = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            document.getElementById('finalTime').textContent = display;
            document.getElementById('finishModal').classList.add('show');
            localStorage.removeItem('workoutStartTime');
            resetWorkout();
        }

        function closeModal() {
            document.getElementById('finishModal').classList.remove('show');
        }

        function resetWorkout() {
            workoutStartTime = null;
            isWorkoutActive = false;
            document.getElementById('btnStart').disabled = false;
            document.getElementById('btnEnd').disabled = true;
            document.getElementById('timerDisplay').textContent = '00:00:00';
        }

        function startRestTimer() {
            if (restTimerInterval) clearInterval(restTimerInterval);
            let restSeconds = 60;
            const restEl = document.getElementById('restTimer');
            restEl.classList.add('active');
            restEl.textContent = `⏳ Descanso: ${restSeconds}s`;
            
            restTimerInterval = setInterval(() => {
                if (restSeconds > 0) {
                    restEl.textContent = `⏳ Descanso: ${restSeconds}s`;
                    restSeconds--;
                } else {
                    clearInterval(restTimerInterval);
                    restEl.classList.remove('active');
                }
            }, 1000);
        }

        function toggleCheck(dayIdx, exIdx) {
            const key = `${dayIdx}-${exIdx}`;
            const el = document.getElementById(`check${key}`);
            
            if (!el.classList.contains('checked')) {
                // Marcar como concluído - COMEÇA TIMER 60s
                el.classList.add('checked');
                el.innerHTML = '✓';
                checkedExercises[key] = true;
                startRestTimer();
            } else {
                // Desmarcar
                el.classList.remove('checked');
                el.innerHTML = '';
                delete checkedExercises[key];
            }
            
            saveState();
            updateProgress();
        }

        function deleteExercise(dayIdx, exIdx) {
            if (confirm('Tem certeza que quer deletar este exercício?')) {
                window.workouts[dayIdx].exercises.splice(exIdx, 1);
                saveState();
                render();
            }
        }

        function addExercise(dayIdx) {
            const name = prompt('Nome do exercício:');
            if (!name) return;
            const sets = prompt('Séries x Reps (ex: 3 x 10):');
            if (!sets) return;
            
            const newExercise = {
                name: name,
                sets: sets,
                video: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(name),
                desc: 'Descrição do exercício',
                steps: '1. Passo 1\n2. Passo 2\n3. Passo 3',
                tips: '✓ Dica 1\n✓ Dica 2',
                avoid: '✗ Evite 1\n✗ Evite 2'
            };
            
            window.workouts[dayIdx].exercises.push(newExercise);
            saveState();
            render();
        }

        function render() {
            const container = document.getElementById('workoutContainer');
            container.innerHTML = '';

            window.workouts.forEach((day, dayIdx) => {
                const dayBox = document.createElement('div');
                dayBox.className = 'day-box';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.onclick = () => toggleDay(dayIdx);
                header.innerHTML = `
                    <div>
                        <div class="day-title">${day.day}</div>
                        <div class="day-focus">${day.focus}</div>
                    </div>
                    <div class="day-controls">
                        <button class="btn-add" onclick="addExercise(${dayIdx})">+ Adicionar</button>
                        <span style="margin-left: 10px;">▼</span>
                    </div>
                `;
                dayBox.appendChild(header);

                const content = document.createElement('div');
                content.id = `day${dayIdx}`;
                content.className = 'hidden';

                day.exercises.forEach((ex, exIdx) => {
                    const key = `${dayIdx}-${exIdx}`;

                    const exercise = document.createElement('div');
                    exercise.className = 'exercise';
                    exercise.onclick = () => toggleExercise(dayIdx, exIdx);

                    const checkbox = document.createElement('div');
                    checkbox.className = 'checkbox';
                    checkbox.id = `check${key}`;
                    checkbox.onclick = (e) => {
                        e.stopPropagation();
                        toggleCheck(dayIdx, exIdx);
                    };

                    if (checkedExercises[key]) {
                        checkbox.classList.add('checked');
                        checkbox.innerHTML = '✓';
                    }

                    const info = document.createElement('div');
                    info.className = 'exercise-info';
                    info.innerHTML = `
                        <div class="exercise-name">${ex.name}</div>
                        <div class="exercise-sets">${ex.sets}</div>
                    `;

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'exercise-delete';
                    deleteBtn.textContent = '✕';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteExercise(dayIdx, exIdx);
                    };

                    exercise.appendChild(checkbox);
                    exercise.appendChild(info);
                    exercise.appendChild(deleteBtn);

                    const details = document.createElement('div');
                    details.className = 'exercise-details';
                    details.id = `details${key}`;
                    details.innerHTML = `
                        <button class="video-btn" onclick="window.open('${ex.video}', '_blank')">
                            📹 Ver Vídeo YouTube
                        </button>
                        <div class="detail-section">
                            <div class="detail-title">📖 Como Fazer:</div>
                            <div>${ex.desc}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">🔢 Passo a Passo:</div>
                            <div style="white-space: pre-wrap;">${ex.steps}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">💡 Dicas:</div>
                            <div style="white-space: pre-wrap;">${ex.tips}</div>
                        </div>
                        <div class="detail-section">
                            <div class="detail-title">⚠️ Evite:</div>
                            <div style="white-space: pre-wrap;">${ex.avoid}</div>
                        </div>
                    `;

                    content.appendChild(exercise);
                    content.appendChild(details);
                });

                dayBox.appendChild(content);
                container.appendChild(dayBox);
            });

            updateProgress();
        }

        function toggleDay(idx) {
            const el = document.getElementById(`day${idx}`);
            el.classList.toggle('hidden');
        }

        function toggleExercise(dayIdx, exIdx) {
            const el = document.getElementById(`details${dayIdx}-${exIdx}`);
            el.classList.toggle('show');
        }

        function updateProgress() {
            let total = 0, checked = 0;
            for (let dayIdx = 0; dayIdx < window.workouts.length; dayIdx++) {
                for (let exIdx = 0; exIdx < window.workouts[dayIdx].exercises.length; exIdx++) {
                    total++;
                    const key = `${dayIdx}-${exIdx}`;
                    if (checkedExercises[key]) checked++;
                }
            }
            const percent = total > 0 ? Math.round((checked / total) * 100) : 0;
            document.getElementById('progressFill').style.width = percent + '%';
        }

        loadState();
        render();
    </script>
</body>
</html>
