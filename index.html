<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 650px; margin: 0 auto; }

        .login-screen { display: none; }
        .login-screen.show { display: block; padding-top: 40px; }
        .login-title { font-size: 36px; text-align: center; margin-bottom: 30px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .profiles-list { display: grid; gap: 12px; margin-bottom: 20px; }
        .profile-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .profile-card:hover { transform: translateY(-5px); }
        .btn-delete-profile { background: #f44336; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .btn-delete-profile:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-new-profile { background: #4CAF50; color: white; border: none; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); }
        .modal.show { display: block; }
        .modal-content { background: linear-gradient(135deg, #2a2a3e 0%, #1a1a2e 100%); margin: 20% auto; padding: 30px; border: 1px solid #667eea; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-content h2 { color: #667eea; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #3a3a4e; border: 1px solid #555; border-radius: 6px; color: white; font-size: 14px; font-family: inherit; }
        .form-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .btn-confirm { flex: 1; background: #4CAF50; border: none; padding: 12px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .btn-cancel { flex: 1; background: #555; border: none; padding: 12px; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }

        .app-screen { display: none; }
        .app-screen.show { display: block; }
        .app-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 15px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-switch { background: rgba(255,255,255,0.2); border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #333; overflow-x: auto; }
        .tab-btn { background: none; border: none; color: #aaa; padding: 12px 20px; cursor: pointer; font-weight: 600; border-bottom: 3px solid transparent; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { color: #4CAF50; border-bottom-color: #4CAF50; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .timer-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 12px; margin-bottom: 20px; text-align: center; }
        .timer-display { font-size: 48px; font-weight: bold; margin-bottom: 15px; font-family: 'Courier New'; }
        .timer-buttons { display: flex; gap: 10px; justify-content: center; }
        .btn-start, .btn-end { border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-start { background: #4CAF50; }
        .btn-end { background: #f44336; }
        .btn-end:disabled { opacity: 0.5; cursor: not-allowed; }

        .progress-bar { background: #333; height: 20px; border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #4CAF50, #45a049); height: 100%; width: 0%; }

        .rest-timer-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); align-items: center; justify-content: center; }
        .rest-timer-modal.show { display: flex; }
        .rest-timer-content { text-align: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px; border-radius: 12px; }
        .rest-timer-display { font-size: 72px; font-weight: bold; margin: 20px 0; font-family: 'Courier New'; color: #4CAF50; }
        .btn-skip-rest { background: #4CAF50; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 20px; }

        .day-box { background: linear-gradient(135deg, #3a3a4e 0%, #2a2a3e 100%); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .day-header { font-weight: bold; font-size: 14px; color: #4CAF50; margin-bottom: 4px; }
        .day-subtitle { font-size: 11px; color: #999; margin-bottom: 12px; }
        .day-exercises { display: flex; flex-direction: column; gap: 8px; }
        .exercise-row { background: #1a1a2e; padding: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .exercise-name { flex: 1; font-size: 12px; }
        .exercise-check { background: #667eea; border: none; color: white; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; }
        .exercise-check.done { background: #4CAF50; }

        .exercise-card { background: linear-gradient(135deg, #3a3a4e 0%, #2a2a3e 100%); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #444; }
        .exercise-name-card { font-weight: bold; color: #667eea; margin-bottom: 4px; }
        .exercise-meta { font-size: 11px; color: #999; }

        .history-stats { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: bold; color: #4CAF50; }
        .history-card { background: linear-gradient(135deg, #3a3a4e 0%, #2a2a3e 100%); padding: 15px; border-radius: 8px; margin-bottom: 10px; }

        .empty-state { text-align: center; padding: 40px 20px; color: #aaa; }
        .btn-add-ex { background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px; width: 100%; }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div id="loginScreen" class="login-screen show">
        <div class="container">
            <div class="login-title">💪 Academia Pro</div>
            <div class="profiles-list" id="profilesList"></div>
            <button class="btn-new-profile" onclick="openNewProfileModal()">➕ Novo Perfil</button>
        </div>
    </div>

    <!-- APP -->
    <div id="appScreen" class="app-screen">
        <div class="container">
            <h1 style="font-size: 24px; margin-bottom: 20px; color: #667eea;">💪 Seu Treino</h1>
            
            <div class="app-header">
                <div id="currentProfileName"></div>
                <button class="btn-switch" onclick="switchProfile()">Trocar</button>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'weekly')">📅 Semana</button>
                <button class="tab-btn" onclick="switchTab(event, 'exercises')">📊 Exercícios</button>
                <button class="tab-btn" onclick="switchTab(event, 'history')">📈 Histórico</button>
            </div>

            <!-- SEMANA -->
            <div id="weekly" class="tab-content active">
                <div style="text-align: center; margin-bottom: 20px; padding: 15px; background: #667eea; border-radius: 8px;">
                    <div style="font-size: 18px; font-weight: bold;">📋 Plano Semanal Padrão</div>
                    <div style="font-size: 12px; margin-top: 8px;">5 Exercícios por Dia (Seg-Sex)</div>
                </div>
                <div id="weeklySummary"></div>
            </div>

            <!-- EXERCÍCIOS -->
            <div id="exercises" class="tab-content">
                <button class="btn-add-ex" onclick="openNewExerciseModal()">➕ Criar Novo Exercício</button>
                <div id="exercisesList"></div>
            </div>

            <!-- HISTÓRICO -->
            <div id="history" class="tab-content">
                <div class="history-stats">
                    <div class="stat-card"><div class="stat-number" id="totalWorkouts">0</div><div style="font-size: 12px;">Treinos</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalHours">0h</div><div style="font-size: 12px;">Tempo Total</div></div>
                </div>
                <div id="historyCards"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NOVO PERFIL -->
    <div id="newProfileModal" class="modal">
        <div class="modal-content">
            <h2>➕ Novo Perfil</h2>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="newProfileName" placeholder="Ex: João">
            </div>
            <div class="form-buttons">
                <button class="btn-confirm" onclick="createProfile()">✓ Criar</button>
                <button class="btn-cancel" onclick="closeModal('newProfileModal')">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL NOVO EXERCÍCIO -->
    <div id="newExerciseModal" class="modal">
        <div class="modal-content">
            <h2>➕ Novo Exercício</h2>
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="newExerciseName" placeholder="Ex: Supino Reto">
            </div>
            <div class="form-group">
                <label>Grupo Muscular</label>
                <select id="newExerciseBodyPart">
                    <option value="chest">🔴 Peito</option>
                    <option value="back">🟠 Costas</option>
                    <option value="biceps">🟡 Bíceps</option>
                    <option value="triceps">🟢 Tríceps</option>
                    <option value="shoulders">🔵 Ombros</option>
                    <option value="legs">🟣 Pernas</option>
                    <option value="core">⚪ Core</option>
                </select>
            </div>
            <div class="form-buttons">
                <button class="btn-confirm" onclick="createExercise()">✓ Criar</button>
                <button class="btn-cancel" onclick="closeModal('newExerciseModal')">✕ Cancelar</button>
            </div>
        </div>
    </div>

    <!-- REST TIMER -->
    <div id="restTimerModal" class="rest-timer-modal">
        <div class="rest-timer-content">
            <div style="font-size: 24px; font-weight: bold;">⏱️ Tempo de Descanso</div>
            <div class="rest-timer-display" id="restTimerDisplay">60</div>
            <button class="btn-skip-rest" onclick="skipRestTimer()">Pular</button>
        </div>
    </div>

    <script>
        // ========== PLANO SEMANAL PADRÃO (5 EX/DIA) ==========
        const WEEKLY_PLAN = {
            'Segunda': {
                subtitle: '💪 Peito + Tríceps (Força)',
                exercises: [
                    {name:"Supino Reto", type:"🔴 Peito"},
                    {name:"Supino Inclinado", type:"🔴 Peito"},
                    {name:"Crucifixo Polia", type:"🔴 Peito"},
                    {name:"Tríceps Corda", type:"🟢 Tríceps"},
                    {name:"Extensão Tríceps", type:"🟢 Tríceps"}
                ]
            },
            'Terça': {
                subtitle: '💪 Costas + Bíceps (Força)',
                exercises: [
                    {name:"Puxada Frontal", type:"🟠 Costas"},
                    {name:"Remada Barra", type:"🟠 Costas"},
                    {name:"Barra Fixa", type:"🟠 Costas"},
                    {name:"Rosca Direta", type:"🟡 Bíceps"},
                    {name:"Rosca Martelo", type:"🟡 Bíceps"}
                ]
            },
            'Quarta': {
                subtitle: '🔥 Perna (Ganho Muscular)',
                exercises: [
                    {name:"Agachamento", type:"🟣 Pernas"},
                    {name:"Leg Press", type:"🟣 Pernas"},
                    {name:"Extensora", type:"🟣 Pernas"},
                    {name:"Rosca Perna", type:"🟣 Pernas"},
                    {name:"Cadeira Adutora", type:"🟣 Pernas"}
                ]
            },
            'Quinta': {
                subtitle: '🌟 Ombro + Perna Leve (Recuperação)',
                exercises: [
                    {name:"Desenvolvimento", type:"🔵 Ombros"},
                    {name:"Elevação Lateral", type:"🔵 Ombros"},
                    {name:"Elevação Frontal", type:"🔵 Ombros"},
                    {name:"Leg Press Leve", type:"🟣 Pernas"},
                    {name:"Extensora Leve", type:"🟣 Pernas"}
                ]
            },
            'Sexta': {
                subtitle: '🔥 HIIT + Core (Queima de Gordura)',
                exercises: [
                    {name:"Mountain Climbers", type:"⚪ Core"},
                    {name:"Prancha", type:"⚪ Core"},
                    {name:"Abdominal", type:"⚪ Core"},
                    {name:"Crunch", type:"⚪ Core"},
                    {name:"Levantamento Perna", type:"⚪ Core"}
                ]
            }
        };

        let currentProfile = null;
        let profiles = [];
        let profileData = {};
        let restTimerInterval = null;

        function createDefaultProfile(name) {
            return {
                name: name,
                weeklyPlan: JSON.parse(JSON.stringify(WEEKLY_PLAN)),
                customExercises: [],
                checkedExercises: {},
                history: []
            };
        }

        function getProfileData() {
            if (!currentProfile || !profileData[currentProfile]) {
                return null;
            }
            return profileData[currentProfile];
        }

        function saveData() {
            if (currentProfile && profileData[currentProfile]) {
                localStorage.setItem(`prof_${currentProfile}`, JSON.stringify(profileData[currentProfile]));
            }
        }

        function loadData() {
            try {
                profiles = JSON.parse(localStorage.getItem('profiles') || '[]');
                
                profiles.forEach(p => {
                    const saved = localStorage.getItem(`prof_${p}`);
                    if (saved) {
                        try {
                            profileData[p] = JSON.parse(saved);
                        } catch (e) {
                            profileData[p] = createDefaultProfile(p);
                        }
                    } else {
                        profileData[p] = createDefaultProfile(p);
                    }
                });
                
                // Garantir que Eduardo existe
                if (!profiles.includes('Eduardo')) {
                    profiles.push('Eduardo');
                    profileData['Eduardo'] = createDefaultProfile('Eduardo');
                    localStorage.setItem('profiles', JSON.stringify(profiles));
                    localStorage.setItem('prof_Eduardo', JSON.stringify(profileData['Eduardo']));
                }
                
                renderProfilesScreen();
            } catch (e) {
                console.error('Erro ao carregar dados:', e);
                alert('Erro ao carregar dados. Reiniciando...');
                localStorage.clear();
                location.reload();
            }
        }

        function renderProfilesScreen() {
            const cont = document.getElementById('profilesList');
            cont.innerHTML = '';
            
            if (!Array.isArray(profiles)) {
                profiles = [];
            }
            
            profiles.forEach(p => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                const isEduardo = p === 'Eduardo';
                card.innerHTML = `
                    <div style="flex: 1; font-weight: bold;">👤 ${p}${isEduardo ? ' ⭐' : ''}</div>
                    <button class="btn-delete-profile" onclick="deleteProfile('${p}')" ${isEduardo ? 'disabled' : ''}>${isEduardo ? '🔒' : '🗑️'}</button>
                `;
                card.onclick = (e) => { if(e.target.className !== 'btn-delete-profile') selectProfile(p); };
                cont.appendChild(card);
            });
        }

        function deleteProfile(name) {
            if (name === 'Eduardo') {
                alert('❌ Eduardo é o perfil padrão e não pode ser deletado!');
                return;
            }
            if (confirm(`Remover perfil "${name}"?`)) {
                profiles = profiles.filter(p => p !== name);
                delete profileData[name];
                localStorage.setItem('profiles', JSON.stringify(profiles));
                localStorage.removeItem(`prof_${name}`);
                renderProfilesScreen();
            }
        }

        function selectProfile(name) {
            currentProfile = name;
            localStorage.setItem('currentProfile', name);
            showAppScreen();
        }

        function openNewProfileModal() {
            document.getElementById('newProfileName').value = '';
            document.getElementById('newProfileModal').classList.add('show');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        function createProfile() {
            const name = document.getElementById('newProfileName').value.trim();
            if (!name) { alert('Digite um nome!'); return; }
            if (profiles.includes(name)) { alert('Perfil já existe!'); return; }
            
            profiles.push(name);
            profileData[name] = createDefaultProfile(name);
            localStorage.setItem('profiles', JSON.stringify(profiles));
            localStorage.setItem(`prof_${name}`, JSON.stringify(profileData[name]));
            closeModal('newProfileModal');
            renderProfilesScreen();
            alert('✓ Perfil criado!');
        }

        function switchProfile() {
            saveData();
            currentProfile = null;
            document.getElementById('loginScreen').classList.add('show');
            document.getElementById('appScreen').classList.remove('show');
        }

        function showAppScreen() {
            document.getElementById('loginScreen').classList.remove('show');
            document.getElementById('appScreen').classList.add('show');
            document.getElementById('currentProfileName').textContent = `👤 ${currentProfile}`;
            renderWeekly();
            renderExercises();
        }

        function switchTab(event, tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');

            if (tab === 'history') renderHistory();
            if (tab === 'exercises') renderExercises();
        }

        // ========== SEMANA ==========
        function renderWeekly() {
            const data = getProfileData();
            if (!data || !data.weeklyPlan) return;
            
            const cont = document.getElementById('weeklySummary');
            cont.innerHTML = '';

            const days = Object.keys(data.weeklyPlan);
            days.forEach((day, idx) => {
                const w = data.weeklyPlan[day];
                const box = document.createElement('div');
                box.className = 'day-box';
                
                const header = document.createElement('div');
                header.className = 'day-header';
                header.textContent = day;
                box.appendChild(header);

                const subtitle = document.createElement('div');
                subtitle.className = 'day-subtitle';
                subtitle.textContent = w.subtitle || '';
                box.appendChild(subtitle);

                const exList = document.createElement('div');
                exList.className = 'day-exercises';
                
                if (Array.isArray(w.exercises)) {
                    w.exercises.forEach((ex, exidx) => {
                        const key = `semana-${idx}-${exidx}`;
                        const isChecked = data.checkedExercises[key];
                        
                        const row = document.createElement('div');
                        row.className = 'exercise-row';
                        
                        const nameSpan = document.createElement('span');
                        nameSpan.className = 'exercise-name';
                        nameSpan.textContent = `${ex.type} ${ex.name}`;
                        
                        const btn = document.createElement('button');
                        btn.className = `exercise-check ${isChecked ? 'done' : ''}`;
                        btn.textContent = isChecked ? '✓' : '○';
                        btn.onclick = () => {
                            if (data.checkedExercises[key]) delete data.checkedExercises[key];
                            else data.checkedExercises[key] = true;
                            saveData();
                            renderWeekly();
                            startRestTimer();
                        };
                        
                        row.appendChild(nameSpan);
                        row.appendChild(btn);
                        exList.appendChild(row);
                    });
                }

                box.appendChild(exList);
                cont.appendChild(box);
            });
        }

        // ========== EXERCÍCIOS ==========
        function renderExercises() {
            const data = getProfileData();
            if (!data) return;
            
            const cont = document.getElementById('exercisesList');
            cont.innerHTML = '';
            
            const customExercises = Array.isArray(data.customExercises) ? data.customExercises : [];
            
            customExercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div class="exercise-name-card">${ex.name || 'Sem nome'}</div>
                    <div class="exercise-meta">${ex.type || 'Sem tipo'}</div>
                `;
                cont.appendChild(card);
            });
            
            if (customExercises.length === 0) {
                cont.innerHTML = '<div class="empty-state">Nenhum exercício customizado ainda</div>';
            }
        }

        function openNewExerciseModal() {
            document.getElementById('newExerciseName').value = '';
            document.getElementById('newExerciseModal').classList.add('show');
        }

        function createExercise() {
            const data = getProfileData();
            if (!data) return;
            
            const name = document.getElementById('newExerciseName').value.trim();
            const bodyPart = document.getElementById('newExerciseBodyPart').value;
            
            if (!name) { alert('Digite o nome do exercício!'); return; }
            
            const typeEmoji = {
                chest: '🔴 Peito',
                back: '🟠 Costas',
                biceps: '🟡 Bíceps',
                triceps: '🟢 Tríceps',
                shoulders: '🔵 Ombros',
                legs: '🟣 Pernas',
                core: '⚪ Core'
            };
            
            if (!Array.isArray(data.customExercises)) {
                data.customExercises = [];
            }
            
            data.customExercises.push({
                name,
                bodyPart,
                type: typeEmoji[bodyPart]
            });
            
            saveData();
            renderExercises();
            closeModal('newExerciseModal');
            alert('✓ Exercício criado!');
        }

        // ========== HISTÓRICO ==========
        function renderHistory() {
            const data = getProfileData();
            if (!data) return;
            
            const hist = Array.isArray(data.history) ? data.history : [];
            document.getElementById('totalWorkouts').textContent = hist.length;
            
            let totalMs = 0;
            hist.forEach(h => totalMs += h.time || 0);
            document.getElementById('totalHours').textContent = Math.floor(totalMs / 3600000) + 'h';

            const cont = document.getElementById('historyCards');
            if (hist.length === 0) {
                cont.innerHTML = '<div class="empty-state">Nenhum treino ainda</div>';
                return;
            }

            cont.innerHTML = '';
            [...hist].reverse().forEach(h => {
                const d = new Date(h.date);
                cont.innerHTML += `
                    <div class="history-card">
                        <div style="font-size: 12px; color: #667eea;">${d.toLocaleDateString('pt-BR')}</div>
                        <div style="font-weight: bold;">${d.toLocaleDateString('pt-BR', {weekday:'long'})}</div>
                        <div style="margin-top: 8px;">⏱️ ${Math.floor(h.time / 60000)}m</div>
                    </div>
                `;
            });
        }

        function startRestTimer() {
            let time = 60;
            document.getElementById('restTimerModal').classList.add('show');
            document.getElementById('restTimerDisplay').textContent = time;
            clearInterval(restTimerInterval);
            restTimerInterval = setInterval(() => {
                time--;
                document.getElementById('restTimerDisplay').textContent = time;
                if (time <= 0) {
                    clearInterval(restTimerInterval);
                    document.getElementById('restTimerModal').classList.remove('show');
                }
            }, 1000);
        }

        function skipRestTimer() {
            clearInterval(restTimerInterval);
            document.getElementById('restTimerModal').classList.remove('show');
        }

        loadData();
    </script>
</body>
</html>
